				pdfjsLib.GlobalWorkerOptions.workerSrc = "javascript/pdf.worker.js";

		} catch (error) {
		}
	</script>
	
	<!-- Script para controlar la instalación de la PWA y Service Worker -->
	<script>
		let deferredPrompt;
		const btnInstall = document.getElementById('btnInstall');

		window.addEventListener('beforeinstallprompt', (e) => {
			// Previene que Chrome muestre el banner automático por defecto
			e.preventDefault();
			// Guarda el evento para dispararlo después
			deferredPrompt = e;
			// Muestra tu botón personalizado
			btnInstall.style.display = 'flex';
		});

		btnInstall.addEventListener('click', async () => {
			if (!deferredPrompt) return;
			// Muestra el mensaje nativo de instalación
			deferredPrompt.prompt();
			// Espera a que el usuario responda al aviso
			const { outcome } = await deferredPrompt.userChoice;
			if (outcome === 'accepted') {
				console.log('El usuario aceptó instalar la PWA');
			}
			// Limpia la variable ya que el prompt no se puede volver a usar
			deferredPrompt = null;
			btnInstall.style.display = 'none';
		});

		window.addEventListener('appinstalled', () => {
			console.log('¡PWA instalada con éxito!');
			btnInstall.style.display = 'none';
			deferredPrompt = null;
		});

		// Registro básico de Service Worker
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', () => {
				navigator.serviceWorker.register('sw.js')
					.then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
					.catch(err => console.log('Error al registrar el Service Worker:', err));
			});
		}
	</script>
